

services:
  redis:
    image: redis:7-alpine
    container_name: cocoa-redis
    # Jamais sur Internet : Docker contourne ufw, et un Redis ouvert a été attaqué du 29 au
    # 31/10/2026 (SLAVEOF, clé SSH dans le dump, requirepass posé par l'attaquant). L'API le
    # joint par le réseau Docker ; 127.0.0.1 garde l'accès local au PC.
    ports:
      - "127.0.0.1:6379:6379"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
      - ./config/redis_config.conf:/usr/local/etc/redis/redis.conf:ro
    # Mot de passe seulement si REDIS_PASSWORD est rempli dans .env (l'API et le vidage le lisent).
    command: ["sh", "-c", "exec redis-server /usr/local/etc/redis/redis.conf $${REDIS_PASSWORD:+--requirepass \"$$REDIS_PASSWORD\"}"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli $${REDIS_PASSWORD:+-a \"$$REDIS_PASSWORD\" --no-auth-warning} ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 3

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.10.2
    container_name: cocoa-mlflow
    # MLflow 2.10 n'a pas d'authentification et a été sondé depuis Internet le 30/10/2026.
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - mlruns:/mlflow/mlruns
      - mlartifacts:/mlflow/mlartifacts
    command: >
      mlflow server
      --backend-store-uri sqlite:///mlflow/mlruns/mlflow.db
      --default-artifact-root /mlflow/mlartifacts
      --host 0.0.0.0
      --port 5000
      --workers 1
      --gunicorn-opts "--timeout 120 --graceful-timeout 30"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cocoa-api
    ports:
      # nginx (VPS) et le tableau de bord local joignent l'API par 127.0.0.1 ; Vercel passe par
      # https://api.market.ste-scpb.com (journaux nginx, agent « node », 01/11/2026).
      - "127.0.0.1:8000:8000"
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - SECRET_KEY=${SECRET_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - DATABENTO_API_KEY=${DATABENTO_API_KEY}
      - TRADINGVIEW_WEBHOOK_SECRET=${TRADINGVIEW_WEBHOOK_SECRET:-}
      # Pas de valeur par defaut : un docker compose up sans le mode echoue au lieu de basculer en silence.
      # .env local : experimental (lot du soir) ; .env du VPS : active.
      - PREDICTION_RELEASE_MODE=${PREDICTION_RELEASE_MODE:?PREDICTION_RELEASE_MODE manquant - ajouter active ou experimental dans .env}
      - HF_HUB_DISABLE_XET=1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MLFLOW_REGISTRY_URI=http://mlflow:5000
    env_file:
      - .env
    volumes:
      - ./src:/app/src
      - ./config:/app/config
      - ./.env:/app/.env:ro
      - ./logs:/app/logs
      - ./models:/app/models
      - ./data:/app/data
      - ./reports:/app/reports
      - ./scripts:/app/scripts:ro
      - ./train_nhits.py:/app/train_nhits.py:ro
      - mlruns:/app/mlruns
      - huggingface_cache:/root/.cache/huggingface
    depends_on:
      redis:
        condition: service_healthy
      mlflow:
        condition: service_started
    restart: unless-stopped
    command: uvicorn src.api.app:app --host 0.0.0.0 --port 8000

volumes:
  redis_data:
  mlruns:
  mlartifacts:
  huggingface_cache:
